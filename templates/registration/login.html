{% extends "base.html" %}
{% load static %}
{% block title %}შესვლა — ZooFlow{% endblock %}
{% block auth_content %}
<div class="auth-layout">
  <div class="auth-panel w-full max-w-md">
    <div class="auth-brand text-center mb-7">
      <img src="{% static 'img/zooflow.svg' %}" class="auth-wordmark" alt="ZooFlow">
      <h1 class="auth-title text-lg font-bold tracking-tight">ZooFlow — Zoomart-ის ხარჯებისა და მოთხოვნების სისტემა</h1>
    </div>
    <div class="card auth-form-card p-6 sm:p-8">
      {% if form.errors %}
        <div class="mb-4 rounded-xl bg-red-50 text-red-700 border border-red-100 px-4 py-3 text-sm">არასწორი მომხმარებელი ან პაროლი.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-4">
          <label class="field-label">მომხმარებლის სახელი</label>
          <input type="text" name="username" class="input" autocomplete="username" autofocus required>
        </div>
        <div class="mb-6">
          <label class="field-label">პაროლი</label>
          <input type="password" name="password" class="input" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-full">შესვლა</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
