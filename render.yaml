services:
  - type: web
    name: zoomart-approval-test
    env: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "bash -c 'python manage.py migrate --noinput && python manage.py seed_demo --fresh && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT'"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.11.9"
